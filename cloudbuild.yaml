steps:
  # Install dependencies
  - name: 'node:22'
    entrypoint: npm
    args: ['install']

  # Build frontend
  - name: 'node:22'
    entrypoint: npm
    args: ['run', 'build']

  # Deploy ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-c', 'gcloud app deploy app.yaml --project=$PROJECT_ID --quiet']
    
options:
  logging: CLOUD_LOGGING_ONLY
